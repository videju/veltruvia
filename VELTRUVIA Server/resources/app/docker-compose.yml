# ═══════════════════════════════════════════════════════════════════════
# VELTRUVIA Docker Compose — cloud deployment
#
#   docker compose up -d            → API on :3000 (behind firewall/VPN only)
#   VELTRUVIA_DOMAIN=emr.example.com docker compose --profile production up -d
#                                   → HTTPS on :80/:443 via automatic Let's Encrypt
#
# Phones (Patient/Lab APKs) and the Doctor desktop app connect to
# https://$VELTRUVIA_DOMAIN — all data is saved on this server.
# ═══════════════════════════════════════════════════════════════════════

services:
  # ── VELTRUVIA EMR Server ──────────────────────────────────────────
  veltruvia:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: veltruvia-emr
    restart: unless-stopped
    # Bind to loopback only when Caddy fronts it; expose :3000 directly otherwise.
    ports:
      - "${VELTRUVIA_BIND:-127.0.0.1}:3000:3000"
      - "${MLLP_BIND:-127.0.0.1}:2575:2575"   # MLLP/TCP (lab instruments)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env — see .env.cloud.example}
      - PHI_ENCRYPTION_KEY=${PHI_ENCRYPTION_KEY:?set PHI_ENCRYPTION_KEY in .env — see .env.cloud.example}
      - DB_PATH=/app/data/veltruvia.db
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-3600000}
      - MLLP_ENABLED=${MLLP_ENABLED:-false}
      - MLLP_PORT=2575
      # Comma-separated extra origins (Capacitor app origins are always allowed)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CAPACITOR_ORIGINS=${CAPACITOR_ORIGINS:-https://localhost,capacitor://localhost}
      # Sentry error tracking (optional)
      # - SENTRY_DSN=https://your-dsn@sentry.io/project-id
    volumes:
      - veltruvia-data:/app/data        # SQLite database + backups
      - veltruvia-logs:/app/logs        # Application logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    networks:
      - veltruvia-net

  # ── Caddy automatic-HTTPS reverse proxy (production) ──────────────
  # Start with:  VELTRUVIA_DOMAIN=emr.example.com docker compose --profile production up -d
  # Needs DNS A/AAAA record → this VM and open inbound 80 + 443.
  caddy:
    image: caddy:2-alpine
    container_name: veltruvia-proxy
    restart: unless-stopped
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VELTRUVIA_DOMAIN=${VELTRUVIA_DOMAIN:?set VELTRUVIA_DOMAIN in .env or the environment}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      veltruvia:
        condition: service_healthy
    networks:
      - veltruvia-net

volumes:
  veltruvia-data:
    driver: local
  veltruvia-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  veltruvia-net:
    driver: bridge
