name: Release

# Build + publish a GitHub Release whenever a version tag is pushed.
# Assets use the EXACT stable names the in-app download page links to
# (releases/latest/download/<name> needs a stable name across releases):
#   VELTRUVIA-Server-Setup.exe / VELTRUVIA-Doctor-Setup.exe
#   VELTRUVIA-Server-Portable.zip / VELTRUVIA-Doctor-Portable.zip
#   VELTRUVIA-Patient.apk / VELTRUVIA-Lab.apk / SHA256SUMS.txt / latest.yml
#
# Auto-update: latest.yml (Server) is rewritten so its `path` points at the
# stable installer name; sha512/size still match the identical installer bytes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: VELTRUVIA Server/resources/app
      - name: Decode code-signing certificate
        shell: pwsh
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
        run: |
          if ($env:CSC_LINK_B64) {
            # Keep the PFX outside the repo/packaged tree — never ship it.
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CSC_LINK_B64))
            Add-Content $env:GITHUB_ENV "CSC_LINK=$pfx"
          } else {
            echo "No CSC_LINK secret — installers will be unsigned"
          }
      - name: Build Server (installer + portable zip)
        shell: pwsh
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --config electron/electron-builder-server.json --publish never
          # Stash the Server updater feed immediately: the Doctor build below
          # writes its own latest.yml into the same folder and would overwrite it.
          Move-Item dist-desktop/latest.yml dist-desktop/latest-server.yml -Force
        working-directory: VELTRUVIA Server/resources/app
      - name: Build Doctor (installer + portable zip)
        run: npx electron-builder --config electron/electron-builder-doctor.json --publish never
        working-directory: VELTRUVIA Server/resources/app
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Stage desktop assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Both electron-builder invocations run from the Server bundle's cwd,
          # so every artifact (either app's) lands in THIS dist-desktop.
          $s = "VELTRUVIA Server/resources/app/dist-desktop"

          # Installers under stable dashed names (never the loose win-unpacked
          # exe — a bare Electron exe cannot run without its DLLs/paks).
          Copy-Item "$s/VELTRUVIA Server Setup*.exe" "dist/VELTRUVIA-Server-Setup.exe"
          Copy-Item "$s/VELTRUVIA Doctor Setup*.exe" "dist/VELTRUVIA-Doctor-Setup.exe"

          # Portable zips (no-install, USB-shareable folders), matched by prefix:
          # electron-builder emits e.g. "VELTRUVIA Doctor-2.0.1-win.zip".
          $zipS = Get-ChildItem "$s/VELTRUVIA Server-*.zip" | Select-Object -First 1
          $zipD = Get-ChildItem "$s/VELTRUVIA Doctor-*.zip" | Select-Object -First 1
          if ($zipS) { Copy-Item $zipS.FullName "dist/VELTRUVIA-Server-Portable.zip" }
          if ($zipD) { Copy-Item $zipD.FullName "dist/VELTRUVIA-Doctor-Portable.zip" }
          if (-not ($zipS -and $zipD)) { Write-Error "portable zips missing from $s" }

          # electron-updater feed: point latest.yml at the stable installer
          # name (bytes unchanged → sha512/size stay valid).
          Copy-Item "$s/latest-server.yml" "dist/latest.yml"
          $y = Get-Content "dist/latest.yml" -Raw
          $y = $y -replace 'VELTRUVIA-Server-Setup-[\d\.]+\.exe', 'VELTRUVIA-Server-Setup.exe'
          Set-Content "dist/latest.yml" $y -Encoding utf8

          # Differential-update blockmaps, renamed to match the installers.
          Copy-Item "$s/VELTRUVIA Server Setup*.exe.blockmap" "dist/VELTRUVIA-Server-Setup.exe.blockmap"
          Copy-Item "$s/VELTRUVIA Doctor Setup*.exe.blockmap" "dist/VELTRUVIA-Doctor-Setup.exe.blockmap" -ErrorAction SilentlyContinue

          # Doctor's own updater feed. The Doctor build ran last, so
          # dist-desktop/latest.yml currently holds the DOCTOR feed — publish
          # it as latest-doctor.yml so the Doctor exe never reads the Server's
          # feed (it would otherwise install the Server installer over itself).
          Move-Item "$s/latest.yml" "dist/latest-doctor.yml" -Force
          $yd = Get-Content "dist/latest-doctor.yml" -Raw
          $yd = $yd -replace 'VELTRUVIA-Doctor-Setup-[\d\.]+\.exe', 'VELTRUVIA-Doctor-Setup.exe'
          Set-Content "dist/latest-doctor.yml" $yd -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # No android-actions/setup-android needed: GitHub's ubuntu-latest image
      # ships the Android SDK (the v3 action crashed on current runners).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VELTRUVIA_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.VELTRUVIA_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret VELTRUVIA_KEYSTORE_B64 not set"; exit 1; }
          [ -n "$KEYSTORE_PASS" ] || { echo "::error::secret VELTRUVIA_KEYSTORE_PASSWORD not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > veltruvia-release.keystore
          echo "$KEYSTORE_PASS" > .keystore-pass
      - name: Build release APKs
        shell: bash
        run: |
          # android/ is a generated project (gitignored) — create it on CI.
          for app in patient lab; do
            pushd "mobile/$app" >/dev/null
            npm ci --no-audit --no-fund
            [ -d android ] || npx cap add android
            popd >/dev/null
          done
          npm run apk:patient -- --release
          npm run apk:lab -- --release
        env:
          VELTRUVIA_KEYSTORE_PASSWORD: ${{ secrets.VELTRUVIA_KEYSTORE_PASSWORD }}
      - name: Stage APK assets
        shell: bash
        run: |
          mkdir -p dist
          # Strictly the SIGNED apk (app-release.apk). An unsigned variant means
          # the signingConfig injection failed — fail loudly, never ship it.
          for app in patient lab; do
            out="mobile/$app/android/app/build/outputs/apk/release"
            if [ -f "$out/app-release.apk" ]; then
              cp "$out/app-release.apk" "dist/VELTRUVIA-${app^}.apk"
            else
              echo "::error::$app: no signed app-release.apk in $out"; ls -la "$out"; exit 1
            fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  # ── SignPath code signing (v2.3 pre-wire) ─────────────────────────
  # Dormant until 3 secrets exist: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID,
  # SIGNPATH_PROJECT_SLUG (signing policy is fixed: test-signing → release).
  # When present: installers are signed via the SignPath GitHub Trusted Build
  # System (key lives on SignPath's HSM — no cert file in the repo), the signed
  # exes replace the unsigned ones, and the updater feeds are re-stamped so
  # electron-updater's sha512 check still passes. SignPath requires the
  # unsigned installer to be uploaded as a GitHub workflow artifact first.
  sign:
    needs: [desktop]
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.gate.outputs.signed }}
    steps:
      - id: gate
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "SIGNPATH_API_TOKEN not set — skipping code signing (installers stay self-signed)"; fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.signed == 'true'
        with:
          name: desktop
          path: unsigned
      - name: Upload unsigned Server installer (SignPath requirement)
        id: upload-server-unsigned
        if: steps.gate.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-server-unsigned
          path: unsigned/VELTRUVIA-Server-Setup.exe
      - name: Upload unsigned Doctor installer (SignPath requirement)
        id: upload-doctor-unsigned
        if: steps.gate.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-doctor-unsigned
          path: unsigned/VELTRUVIA-Doctor-Setup.exe
      - name: Sign Server installer via SignPath
        if: steps.gate.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-server-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: 'signed/server'
          parameters: 'version: "${{ github.ref_name }}"'
      - name: Sign Doctor installer via SignPath
        if: steps.gate.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-doctor-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: 'signed/doctor'
          parameters: 'version: "${{ github.ref_name }}"'
      - name: Stage signed installers
        if: steps.gate.outputs.signed == 'true'
        shell: bash
        run: |
          mkdir -p signed-dist
          find signed -name '*.exe' -exec cp {} signed-dist/ \;
          ls -la signed-dist
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.signed == 'true'
        with:
          name: signed-desktop
          path: signed-dist/*.exe

  publish:
    needs: [sign, android]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.sign.outputs.signed == 'true'
        with:
          name: signed-desktop
          path: signed-overlay
      - name: Replace installers + re-stamp updater feeds (signed)
        if: needs.sign.outputs.signed == 'true'
        shell: python
        run: |
          import hashlib, re, shutil, pathlib
          d = pathlib.Path('dist')
          # Signing changes the exe bytes → re-stamp the sha512/size in both
          # electron-updater feeds, or auto-update would reject the signed exe.
          for feed, exe in (('dist/latest.yml', 'VELTRUVIA-Server-Setup.exe'),
                            ('dist/latest-doctor.yml', 'VELTRUVIA-Doctor-Setup.exe')):
              src = pathlib.Path('signed-overlay') / exe
              if not src.exists():
                  print(f'WARNING: signed {exe} missing — feed {feed} left untouched'); continue
              shutil.copyfile(src, d / exe)
              data = (d / exe).read_bytes()
              y = (pathlib.Path(feed)).read_text()
              y = re.sub(r'sha512: \S+', 'sha512: ' + hashlib.sha512(data).hexdigest(), y, count=1)
              y = re.sub(r'size: \d+', 'size: ' + str(len(data)), y, count=1)
              pathlib.Path(feed).write_text(y)
              print(f're-stamped {feed} for signed {exe}')
          # Differential blockmaps no longer match the signed bytes — drop them
          # (updater falls back to full download, which is always correct).
          for bm in d.glob('*.blockmap'): bm.unlink()
          print('removed stale blockmaps')
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum VELTRUVIA-*.exe VELTRUVIA-*.zip VELTRUVIA-*.apk > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VELTRUVIA-Server-Setup.exe
            dist/VELTRUVIA-Doctor-Setup.exe
            dist/VELTRUVIA-Server-Portable.zip
            dist/VELTRUVIA-Doctor-Portable.zip
            dist/VELTRUVIA-Patient.apk
            dist/VELTRUVIA-Lab.apk
            dist/SHA256SUMS.txt
            dist/latest.yml
            dist/latest-doctor.yml
            dist/VELTRUVIA-Server-Setup.exe.blockmap
          generate_release_notes: true
