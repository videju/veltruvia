name: Release

# Build + publish a GitHub Release whenever a version tag is pushed.
# Assets use the EXACT stable names the in-app download page links to
# (releases/latest/download/<name> needs a stable name across releases):
#   VELTRUVIA-Server-Setup.exe / VELTRUVIA-Doctor-Setup.exe
#   VELTRUVIA-Server-Portable.zip / VELTRUVIA-Doctor-Portable.zip
#   VELTRUVIA-Patient.apk / VELTRUVIA-Lab.apk / SHA256SUMS.txt / latest.yml
#
# Auto-update: latest.yml (Server) is rewritten so its `path` points at the
# stable installer name; sha512/size still match the identical installer bytes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: VELTRUVIA Server/resources/app
      - name: Build Server (installer + portable zip)
        shell: pwsh
        run: |
          npx electron-builder --config electron/electron-builder-server.json
          # Stash the Server updater feed immediately: the Doctor build below
          # writes its own latest.yml into the same folder and would overwrite it.
          Move-Item dist-desktop/latest.yml dist-desktop/latest-server.yml -Force
        working-directory: VELTRUVIA Server/resources/app
      - name: Build Doctor (installer + portable zip)
        run: npx electron-builder --config electron/electron-builder-doctor.json
        working-directory: VELTRUVIA Server/resources/app
      - name: Stage desktop assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $s = "VELTRUVIA Server/resources/app/dist-desktop"
          $d = "VELTRUVIA Doctor/resources/app/dist-desktop"

          # Installers under stable dashed names (never the loose win-unpacked
          # exe — a bare Electron exe cannot run without its DLLs/paks).
          Copy-Item "$s/VELTRUVIA Server Setup*.exe" "dist/VELTRUVIA-Server-Setup.exe"
          Copy-Item "$d/VELTRUVIA Doctor Setup*.exe" "dist/VELTRUVIA-Doctor-Setup.exe"

          # Portable zips (no-install, USB-shareable folders).
          $zipS = Get-ChildItem "$s/*.zip" | Select-Object -First 1
          $zipD = Get-ChildItem "$d/*.zip" | Select-Object -First 1
          if ($zipS) { Copy-Item $zipS.FullName "dist/VELTRUVIA-Server-Portable.zip" }
          if ($zipD) { Copy-Item $zipD.FullName "dist/VELTRUVIA-Doctor-Portable.zip" }

          # electron-updater feed: point latest.yml at the stable installer
          # name (bytes unchanged → sha512/size stay valid).
          Copy-Item "$s/latest-server.yml" "dist/latest.yml"
          $y = Get-Content "dist/latest.yml" -Raw
          $y = $y -replace 'VELTRUVIA-Server-Setup-[\d\.]+\.exe', 'VELTRUVIA-Server-Setup.exe'
          Set-Content "dist/latest.yml" $y -Encoding utf8

          # Differential-update blockmaps, renamed to match the installers.
          Copy-Item "$s/VELTRUVIA Server Setup*.exe.blockmap" "dist/VELTRUVIA-Server-Setup.exe.blockmap"
          Copy-Item "$d/VELTRUVIA Doctor Setup*.exe.blockmap" "dist/VELTRUVIA-Doctor-Setup.exe.blockmap" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VELTRUVIA_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.VELTRUVIA_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret VELTRUVIA_KEYSTORE_B64 not set"; exit 1; }
          [ -n "$KEYSTORE_PASS" ] || { echo "::error::secret VELTRUVIA_KEYSTORE_PASSWORD not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > veltruvia-release.keystore
          echo "$KEYSTORE_PASS" > .keystore-pass
      - name: Build release APKs
        shell: bash
        run: |
          npm run apk:patient -- --release
          npm run apk:lab -- --release
        env:
          VELTRUVIA_KEYSTORE_PASSWORD: ${{ secrets.VELTRUVIA_KEYSTORE_PASSWORD }}
      - name: Stage APK assets
        shell: bash
        run: |
          mkdir -p dist
          cp mobile/patient/android/app/build/outputs/apk/release/app-release.apk "dist/VELTRUVIA-Patient.apk"
          cp mobile/lab/android/app/build/outputs/apk/release/app-release.apk "dist/VELTRUVIA-Lab.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum VELTRUVIA-*.exe VELTRUVIA-*.zip VELTRUVIA-*.apk > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VELTRUVIA-Server-Setup.exe
            dist/VELTRUVIA-Doctor-Setup.exe
            dist/VELTRUVIA-Server-Portable.zip
            dist/VELTRUVIA-Doctor-Portable.zip
            dist/VELTRUVIA-Patient.apk
            dist/VELTRUVIA-Lab.apk
            dist/SHA256SUMS.txt
            dist/latest.yml
            dist/VELTRUVIA-Server-Setup.exe.blockmap
          generate_release_notes: true
