name: Release

# Build + publish a GitHub Release whenever a version tag is pushed.
# Assets use the EXACT names the in-app download page links to:
#   VELTRUVIA Server.exe / VELTRUVIA Doctor.exe / VELTRUVIA Patient.apk / VELTRUVIA Lab.apk
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: VELTRUVIA Server/resources/app
      - name: Build Server exe
        run: npx electron-builder --config electron/electron-builder-server.json
        working-directory: VELTRUVIA Server/resources/app
      - name: Build Doctor exe
        run: npx electron-builder --config electron/electron-builder-doctor.json
        working-directory: VELTRUVIA Server/resources/app
      - name: Stage desktop assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "VELTRUVIA Server/resources/app/dist-desktop/win-unpacked/VELTRUVIA Server.exe" "dist/"
          Copy-Item "VELTRUVIA Server/resources/app/dist-desktop/win-unpacked/VELTRUVIA Doctor.exe" "dist/"
          # NSIS installers + latest.yml — electron-updater reads latest.yml for auto-update
          Copy-Item "VELTRUVIA Server/resources/app/dist-desktop/*.exe" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "VELTRUVIA Server/resources/app/dist-desktop/latest.yml" "dist/" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VELTRUVIA_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.VELTRUVIA_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret VELTRUVIA_KEYSTORE_B64 not set"; exit 1; }
          [ -n "$KEYSTORE_PASS" ] || { echo "::error::secret VELTRUVIA_KEYSTORE_PASSWORD not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > veltruvia-release.keystore
          echo "$KEYSTORE_PASS" > .keystore-pass
      - name: Build release APKs
        shell: bash
        run: |
          npm run apk:patient -- --release
          npm run apk:lab -- --release
        env:
          VELTRUVIA_KEYSTORE_PASSWORD: ${{ secrets.VELTRUVIA_KEYSTORE_PASSWORD }}
      - name: Stage APK assets
        shell: bash
        run: |
          mkdir -p dist
          cp mobile/patient/android/app/build/outputs/apk/release/app-release.apk "dist/VELTRUVIA Patient.apk"
          cp mobile/lab/android/app/build/outputs/apk/release/app-release.apk "dist/VELTRUVIA Lab.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum "VELTRUVIA Server.exe" "VELTRUVIA Doctor.exe" "VELTRUVIA Patient.apk" "VELTRUVIA Lab.apk" > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VELTRUVIA Server.exe
            dist/VELTRUVIA Doctor.exe
            dist/VELTRUVIA Patient.apk
            dist/VELTRUVIA Lab.apk
            dist/SHA256SUMS.txt
            dist/*.exe
            dist/latest.yml
          generate_release_notes: true
